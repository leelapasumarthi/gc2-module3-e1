<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="admin-panel">
          <button id="admin-toggle" type="button">Teacher Login</button>
          <button id="admin-logout" type="button" class="hidden">Log Out</button>
          <form id="admin-login-form" class="hidden">
            <input id="admin-username" type="text" placeholder="Username" required />
            <input id="admin-password" type="password" placeholder="Password" required />
            <button type="submit">Sign In</button>
          </form>
          <p id="admin-status" class="admin-status hidden"></p>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Teacher Management</h3>
        <p>Students can view who is registered, while teachers can sign in to manage student registrations.</p>
        <div id="message" class="message hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
